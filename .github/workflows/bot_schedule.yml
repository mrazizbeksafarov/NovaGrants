name: Nova Grants Bot

on:
  schedule:
    # GitHub Actions navbatida kutadi — o'lchangan kechikish 2s42d–3s17d
    # (2–6 avgust, 2026). Ilgari '0 3' turardi va postlar 08:00 emas, ~10:45
    # (Toshkent) da chiqardi. 00:20 UTC + ~2s50d ≈ 03:10 UTC ≈ 08:10 Toshkent.
    # Soat boshi yuklama cho'qqisi bo'lgani uchun 20-daqiqa tanlandi.
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Quruq sinov (kanalga yubormasdan tekshirish)"
        type: boolean
        default: false
      test_message:
        description: "Adminga test xabarini yuborish"
        type: boolean
        default: false


# Bir vaqtda faqat bitta yurish — takror post xavfini yo'q qiladi
concurrency:
  group: nova-grants-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # curl_cffi bot himoyasi bo'lgan saytlarni ochadi, lekin SHART EMAS.
      # O'rnatilmasa http_client.py oddiy `requests` ga qaytadi. Shuning uchun
      # bu qadam yiqilsa ham kunlik post to'xtamaydi.
      - name: Bot himoyasi mijozi (ixtiyoriy)
        continue-on-error: true
        run: pip install -r requirements-optional.txt

      - name: Mijoz holati
        run: python -c "import http_client; print('curl_cffi:', http_client.HAS_CURL)"

      # Testlar tarmoqsiz ishlaydi va ~1 soniya oladi. Buzilgan kod kanalga
      # chiqmasligi uchun botdan OLDIN turadi.
      - name: Testlar
        run: python -m pytest tests/ -q

      - name: Rich blok sxemasini tekshirish
        run: python tools/check_rich_spec.py

      - name: Adminga test xabari yuborish
        if: ${{ inputs.test_message }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          python -c "import urllib.request, urllib.parse, os; token = os.environ.get('TELEGRAM_BOT_TOKEN'); admin = os.environ.get('ADMIN_ID'); text = 'Salom Azizbek! 🚀 Nova Grants (@grantbasebot) dan test xabari muvaffaqiyatli yetib keldi.\n\nBarcha tizimlar, xususan:\n• Gemini 3.8 Flash (High Thinking)\n• Supabase bazasi\n• Log va Alert tizimi\n• Asl rasmiy domenlar filtri\n100% faol holatda ishlamoqda!'; data = urllib.parse.urlencode({'chat_id': admin, 'text': text, 'parse_mode': 'HTML'}).encode('utf-8'); req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data); res = urllib.request.urlopen(req); print('Telegram javobi:', res.read().decode('utf-8'))"

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: python main.py 2>&1 | tee bot_run.log

      - name: Log faylini saqlash (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-run-log-${{ github.run_number }}
          path: bot_run.log
          retention-days: 30

