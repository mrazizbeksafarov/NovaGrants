name: Nova Grants Bot

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  schedule:
    # GitHub Actions navbatida kutadi — o'lchangan kechikish 2s42d–3s17d
    # (2–6 avgust, 2026). Ilgari '0 3' turardi va postlar 08:00 emas, ~10:45
    # (Toshkent) da chiqardi. 00:20 UTC + ~2s50d ≈ 03:10 UTC ≈ 08:10 Toshkent.
    # Soat boshi yuklama cho'qqisi bo'lgani uchun 20-daqiqa tanlandi.
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Quruq sinov (kanalga yubormasdan tekshirish)"
        type: boolean
        default: false
      test_message:
        description: "Adminga test xabarini yuborish"
        type: boolean
        default: false


# Bir vaqtda faqat bitta yurish — takror post xavfini yo'q qiladi
concurrency:
  group: nova-grants-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Kodni yuklash
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python o'rnatish
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18' # tested production runtime; update via PR
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          pip install -r requirements.txt -c constraints.txt

      # curl_cffi bot himoyasi bo'lgan saytlarni ochadi, lekin SHART EMAS.
      # O'rnatilmasa http_client.py oddiy `requests` ga qaytadi. Shuning uchun
      # bu qadam yiqilsa ham kunlik post to'xtamaydi.
      - name: Bot himoyasi mijozi (ixtiyoriy)
        continue-on-error: true
        run: pip install -r requirements-optional.txt -c constraints.txt

      - name: Mijoz holati
        run: python -c "import http_client; print('curl_cffi:', http_client.HAS_CURL)"

      # Testlar tarmoqsiz ishlaydi va ~1 soniya oladi. Buzilgan kod kanalga
      # chiqmasligi uchun botdan OLDIN turadi.
      - name: Testlar
        run: python -m pytest tests/ -q

      - name: Rich blok sxemasini tekshirish
        run: python tools/check_rich_spec.py

      - name: Adminga test xabari yuborish
        if: ${{ inputs.test_message }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          python -c "from telegram_bot import notify_admin; import sys; sys.exit(0 if notify_admin('Nova Grants: Telegram bildirishnomasi uchun ulanish testi.') else 1)"

      - name: Botni ishga tushirish
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS || 'gemini-3.6-flash,gemini-3.8-flash,gemini-3.7-flash' }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'medium' }}
          AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS || '240' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: python main.py 2>&1 | tee bot_run.log

      - name: Ishga tushishdan oldingi xatoni bildirish
        if: ${{ failure() && steps.checkout.outcome == 'success' && steps.bot.outcome == 'skipped' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python tools/workflow_alert.py

      - name: Log faylini saqlash (Artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot-run-log-${{ github.run_number }}
          path: bot_run.log
          retention-days: 30

