name: Nova Grants Bot

on:
  schedule:
    # GitHub Actions navbatida kutadi — o'lchangan kechikish 2s42d–3s17d
    # (2–6 avgust, 2026). Ilgari '0 3' turardi va postlar 08:00 emas, ~10:45
    # (Toshkent) da chiqardi. 00:20 UTC + ~2s50d ≈ 03:10 UTC ≈ 08:10 Toshkent.
    # Soat boshi yuklama cho'qqisi bo'lgani uchun 20-daqiqa tanlandi.
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Quruq sinov (kanalga yubormasdan tekshirish)"
        type: boolean
        default: false

# Bir vaqtda faqat bitta yurish — takror post xavfini yo'q qiladi
concurrency:
  group: nova-grants-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Testlar tarmoqsiz ishlaydi va ~1 soniya oladi. Buzilgan kod kanalga
      # chiqmasligi uchun botdan OLDIN turadi.
      - name: Testlar
        run: python -m pytest tests/ -q

      - name: Rich blok sxemasini tekshirish
        run: python tools/check_rich_spec.py

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONIOENCODING: utf-8
        run: python main.py
