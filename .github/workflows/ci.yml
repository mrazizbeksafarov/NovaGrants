name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - run: python -m pytest tests/ -q
      - run: python tools/check_rich_spec.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - run: python -m pip install 'ruff>=0.17,<0.18' 'bandit>=1.9,<2' 'pip-audit>=2.10,<3'
      - run: python -m ruff check . --select E9,F821,F822,F823
      - run: python -m bandit -lll *.py
      - run: python -m pip_audit --local
