# Rejalashtirilgan workflow'larni 60 kunlik nofaollik sabab o'chib qolishdan saqlaydi.
#
# NEGA KERAK: GitHub OCHIQ repozitoriyada `schedule` bilan ishlaydigan
# workflow'ni repozitoriyada 60 KUN faollik bo'lmasa AVTOMATIK O'CHIRIB QO'YADI.
#
# `main` tarmog'i branch protection bilan himoyalangan (PR va CI talab qilinadi),
# shuning uchun to'g'ridan-to'g'ri `git push` GH006 xatosi bilan yiqiladi.
# Buning o'rniga GitHub Actions REST API `PUT .../enable` orqali rejalashtirilgan
# workflow'larning faollik hisoblagichi har oyda yangilab turiladi.

name: Keepalive

on:
  schedule:
    # Har oyning 1-kuni, 05:40 UTC. Botning yurishi (00:20) bilan
    # to'qnashmasligi uchun boshqa vaqt tanlandi.
    - cron: '40 5 1 * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: nova-grants-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Rejalashtirilgan workflow'larni faol holatda ushlab turish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in bot_schedule.yml keepalive.yml; do
            gh api --method PUT "repos/${REPO}/actions/workflows/${wf}/enable"
            echo "Enabled/refreshed workflow: ${wf}"
          done
